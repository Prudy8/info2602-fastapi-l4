$kind: http-example
request:
  url: "{{baseUrl}}/token"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      username: string
      password: string
      grant_type: password
      scope: ""
      client_id: string
      client_secret: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "token_type": "string"
      }
order: 1000
