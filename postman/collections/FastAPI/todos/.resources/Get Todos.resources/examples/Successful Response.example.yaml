$kind: http-example
request:
  url: "{{baseUrl}}/todos"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "text": "string",
          "id": 9805,
          "done": false
        },
        {
          "text": "string",
          "id": 3627,
          "done": false
        }
      ]
order: 1000
