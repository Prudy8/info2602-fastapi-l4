$kind: http-example
request:
  url: "{{host}}/mypokemon/{{id}}"
  method: PUT
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{ "name": "{{$randomFirstName}}"}'
response:
  statusCode: 200
  statusText: OK
  headers:
    Access-Control-Allow-Origin: "*"
    Content-Length: "46"
    Content-Type: application/json
    Date: Sun, 03 Mar 2024 00:40:15 GMT
    Server: Werkzeug/3.0.1 Python/3.8.16
  body:
    type: json
    content: |-
      {
          "message": "Reinhold renamed to Mylene"
      }
order: 1000
