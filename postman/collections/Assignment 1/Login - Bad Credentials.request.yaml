$kind: http-request
description: Shows an appropriate error message and status when login fails
url: "{{host}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: username
      value: rocky3223
    - type: text
      key: password
      value: lol
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      
      pm.test("Should return 'bad username/password given'", function () {
          var {detail} = pm.response.json();
      	pm.expect(detail).to.eql('bad username/password given');
      });


      pm.test(
      	"Should respond with the correct status", 
      	function () {
      		pm.response.to.have.status(401);
      	}
      );
    language: text/javascript
examples: ./.resources/Login - Bad Credentials.resources/examples
order: 6000
